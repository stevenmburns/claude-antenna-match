[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antmatch"
version = "0.1.0"
description = "Broadband matching network design with co-optimizable antenna geometry."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Steven Burns" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
timeout = 10
timeout_method = "thread"
markers = [
    "slow: long-running optimization tests (deselect with '-m not slow', already deselected by default)",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
